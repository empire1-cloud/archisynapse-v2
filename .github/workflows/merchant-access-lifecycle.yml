name: Merchant access lifecycle checks

on:
  pull_request:
    paths:
      - "tools/merchant-admin/**"
      - "services/gateway/gateway_store.py"
      - "services/gateway/requirements.txt"
      - ".github/workflows/merchant-access-lifecycle.yml"
  push:
    branches:
      - main
    paths:
      - "tools/merchant-admin/**"
      - "services/gateway/gateway_store.py"
      - "services/gateway/requirements.txt"

jobs:
  lifecycle-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gateway dependencies
        run: python -m pip install -r services/gateway/requirements.txt
      - name: Compile operator
        run: python -m py_compile tools/merchant-admin/app.py
      - name: Run lifecycle tests
        run: python -m unittest discover -s tools/merchant-admin/tests -p "test_*.py" -v
