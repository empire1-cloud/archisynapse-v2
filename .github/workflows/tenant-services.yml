name: Tenant isolation (ledger and transaction services)

on:
  pull_request:
    paths:
      - "services/ledger/**"
      - "services/transaction/**"
      - "migrations/**"
      - ".github/workflows/tenant-services.yml"
  push:
    branches:
      - main
    paths:
      - "services/ledger/**"
      - "services/transaction/**"
      - "migrations/**"

jobs:
  services-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: archisynapse
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d archisynapse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/archisynapse
      PGPASSWORD: postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Apply PostgreSQL migrations
        run: |
          for migration in migrations/*.sql; do
            echo "Applying ${migration}"
            psql -h 127.0.0.1 -U postgres -d archisynapse -v ON_ERROR_STOP=1 -f "${migration}"
          done

      - name: Build ledger and transaction services
        run: |
          npm run build --workspace=services/ledger
          npm run build --workspace=services/transaction

      - name: Ledger service tests (unit + tenant role on Postgres)
        run: npm run test --workspace=services/ledger -- --run

      - name: Transaction service tests (unit + tenant role on Postgres)
        run: npm run test --workspace=services/transaction -- --run
