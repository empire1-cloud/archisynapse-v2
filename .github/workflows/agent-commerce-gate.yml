name: Agent Commerce Gate

on:
  push:
    branches:
      - agent/agent-commerce-rail
    paths:
      - "services/agent-commerce/**"
      - "docs/AGENT_COMMERCE_RAIL.md"
      - ".github/workflows/agent-commerce-gate.yml"
  pull_request:
    paths:
      - "services/agent-commerce/**"
      - "docs/AGENT_COMMERCE_RAIL.md"
      - ".github/workflows/agent-commerce-gate.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/agent-commerce
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: python -m compileall -q agent_commerce
      - run: pytest
