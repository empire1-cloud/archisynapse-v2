name: Gateway proof checks

on:
  pull_request:
    paths:
      - "services/gateway/**"
      - "migrations/**"
      - "docker-compose.yml"
      - ".github/workflows/gateway-proof.yml"
  push:
    branches:
      - main
    paths:
      - "services/gateway/**"
      - "migrations/**"
      - "docker-compose.yml"

jobs:
  gateway-python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gateway dependencies
        run: python -m pip install -r services/gateway/requirements.txt

      - name: Compile gateway files
        working-directory: services/gateway
        run: python -m py_compile gateway_store.py production_main.py

      - name: Run gateway utility tests
        working-directory: services/gateway
        run: python -m unittest discover -s tests -p "test_gateway_store.py" -v
