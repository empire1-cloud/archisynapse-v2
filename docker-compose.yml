version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: archisynapse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
      - ./infra/postgres/zz_analytics_database.sql:/docker-entrypoint-initdb.d/zz_analytics_database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot setup: makes sure the analytics database exists on every start,
  # for new and existing volumes. Exits when done; safe to run repeatedly.
  db-setup:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./infra/postgres/ensure_analytics_database.sql:/ensure_analytics_database.sql:ro
    command: ["psql", "-h", "postgres", "-U", "postgres", "-d", "postgres", "-v", "ON_ERROR_STOP=1", "-f", "/ensure_analytics_database.sql"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # One-shot setup: creates the internal service tokens once (kept in
  # service_tokens_store, mounted only here) and gives each service a volume
  # holding only what it needs. Lets the ledger and transaction services
  # reject callers that are not the gateway or the transaction service.
  # Exits when done; safe to run repeatedly. See docs/SERVICE_AUTH.md.
  service-tokens:
    image: alpine:3.20
    volumes:
      - service_tokens_store:/service-tokens/store
      - service_tokens_gateway:/service-tokens/gateway
      - service_tokens_transaction:/service-tokens/transaction
      - service_tokens_ledger:/service-tokens/ledger
      - ./infra/service-auth/generate_service_tokens.sh:/generate_service_tokens.sh:ro
    command: ["sh", "/generate_service_tokens.sh"]
    restart: "no"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  transaction-service:
    build:
      context: .
      dockerfile: services/transaction/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/archisynapse
      ARCHISYNAPSE_TENANT_ISOLATION: ${ARCHISYNAPSE_TENANT_ISOLATION:-enforce}
      REDIS_URL: redis://redis:6379
      ARCHISYNAPSE_PROCESSOR: ${ARCHISYNAPSE_PROCESSOR:-disabled}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_API_BASE_URL: ${STRIPE_API_BASE_URL:-https://api.stripe.com/v1}
      ARCHISYNAPSE_LIVE_SMOKE_TEST_ENABLED: ${ARCHISYNAPSE_LIVE_SMOKE_TEST_ENABLED:-false}
      ARCHISYNAPSE_LIVE_SMOKE_TEST_CONFIRM: ${ARCHISYNAPSE_LIVE_SMOKE_TEST_CONFIRM:-}
      LEDGER_SERVICE_URL: http://ledger-service:3001
      # Only the gateway may call this service; it proves it with a token.
      ARCHISYNAPSE_SERVICE_AUTH: ${ARCHISYNAPSE_SERVICE_AUTH:-enforce}
      ARCHISYNAPSE_INBOUND_SERVICE_TOKENS_FILE: /run/service-tokens/inbound.tokens
      ARCHISYNAPSE_TRANSACTION_TO_LEDGER_TOKEN_FILE: /run/service-tokens/transaction-to-ledger.token
    volumes:
      - service_tokens_transaction:/run/service-tokens:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      service-tokens:
        condition: service_completed_successfully

  ledger-service:
    build:
      context: .
      dockerfile: services/ledger/Dockerfile
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/archisynapse
      ARCHISYNAPSE_TENANT_ISOLATION: ${ARCHISYNAPSE_TENANT_ISOLATION:-enforce}
      REDIS_URL: redis://redis:6379
      # Only the transaction service may write here; the gateway may only read.
      ARCHISYNAPSE_SERVICE_AUTH: ${ARCHISYNAPSE_SERVICE_AUTH:-enforce}
      ARCHISYNAPSE_INBOUND_SERVICE_TOKENS_FILE: /run/service-tokens/inbound.tokens
    volumes:
      - service_tokens_ledger:/run/service-tokens:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      service-tokens:
        condition: service_completed_successfully

  fraud-service:
    build:
      context: .
      dockerfile: services/fraud/Dockerfile
    ports:
      - "8000:8000"
    environment:
      ARCHISYNAPSE_DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/archisynapse
      ARCHISYNAPSE_PEPPER: ${ARCHISYNAPSE_PEPPER:-dev-only-insecure-pepper}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  analytics-service:
    build:
      context: .
      dockerfile: services/analytics/Dockerfile
    ports:
      - "8081:8081"
    environment:
      # Own database: its `merchants` and `transactions` tables collide with
      # the fraud service and the ledger. Created by the db-setup service.
      ARCHISYNAPSE_DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/archisynapse_analytics
      ARCHISYNAPSE_PEPPER: ${ARCHISYNAPSE_PEPPER:-dev-only-insecure-pepper}
    depends_on:
      postgres:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    ports:
      - "9000:9000"
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/archisynapse
      TRANSACTION_SERVICE_URL: http://transaction-service:3000
      LEDGER_SERVICE_URL: http://ledger-service:3001
      FRAUD_SERVICE_URL: http://fraud-service:8000
      ANALYTICS_SERVICE_URL: http://analytics-service:8081
      ARCHISYNAPSE_ADMIN_TOKEN: ${ARCHISYNAPSE_ADMIN_TOKEN:-}
      ARCHISYNAPSE_GATEWAY_MASTER_KEY: ${ARCHISYNAPSE_GATEWAY_MASTER_KEY:-}
      ARCHISYNAPSE_TENANT_ISOLATION: ${ARCHISYNAPSE_TENANT_ISOLATION:-enforce}
      ARCHISYNAPSE_GATEWAY_KEY_ID: ${ARCHISYNAPSE_GATEWAY_KEY_ID:-gateway-v1}
      ARCHISYNAPSE_RECEIPT_SIGNING_PRIVATE_KEY: ${ARCHISYNAPSE_RECEIPT_SIGNING_PRIVATE_KEY:-}
      ARCHISYNAPSE_RECEIPT_SIGNING_KEY_ID: ${ARCHISYNAPSE_RECEIPT_SIGNING_KEY_ID:-receipt-v1}
      ARCHISYNAPSE_RECEIPT_RETIRED_PUBLIC_KEYS: ${ARCHISYNAPSE_RECEIPT_RETIRED_PUBLIC_KEYS:-}
      ARCHISYNAPSE_PROCESSOR: ${ARCHISYNAPSE_PROCESSOR:-disabled}
      # Fails closed by default. It must be explicitly enabled after its
      # signing keys and tenant configuration are verified.
      ROYALTY_LOOP_ENABLED: ${ROYALTY_LOOP_ENABLED:-false}
      ROYALTY_ADMIN_TOKEN: ${ROYALTY_ADMIN_TOKEN:-}
      ROYALTY_TEST_FIXTURES_ENABLED: ${ROYALTY_TEST_FIXTURES_ENABLED:-false}
      ARCHISYNAPSE_GATEWAY_TO_TRANSACTION_TOKEN_FILE: /run/service-tokens/gateway-to-transaction.token
      ARCHISYNAPSE_GATEWAY_TO_LEDGER_TOKEN_FILE: /run/service-tokens/gateway-to-ledger.token
    volumes:
      - service_tokens_gateway:/run/service-tokens:ro
    depends_on:
      postgres:
        condition: service_healthy
      fraud-service:
        condition: service_started
      analytics-service:
        condition: service_started
      transaction-service:
        condition: service_started
      ledger-service:
        condition: service_started
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  service_tokens_store:
  service_tokens_gateway:
  service_tokens_transaction:
  service_tokens_ledger:
